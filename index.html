<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#11171f"/><meta name="description" content="Control the six joints of your LR Mate 3D robot with precise angle inputs and draggable sliders."/><title>Robot Controller</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2311171f'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2375bfff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2375bfff'/%3E%3C/svg%3E"/></head>
<body><main class="workspace"><header class="page-heading"><h1 class="sr-only">Robot Controller</h1><button id="robododge-toggle" class="robododge-toggle" type="button" aria-pressed="false" aria-label="Play RoboLimbo" disabled><span class="limbo-wall" aria-hidden="true"><img src="/robolimbo-logo.png" alt=""/></span><span class="limbo-label">RoboLimbo</span><svg class="limbo-action" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path class="limbo-play" d="M8 5v14l11-7z"/><path class="limbo-exit" d="m7.4 6 4.6 4.6L16.6 6 18 7.4 13.4 12l4.6 4.6-1.4 1.4-4.6-4.6L7.4 18 6 16.6l4.6-4.6L6 7.4z"/></svg></button></header><section class="controller" aria-label="Robot control workspace"><section class="viewport" aria-label="Interactive 3D robot"><canvas id="robot-canvas" aria-label="3D LR Mate robot. Drag to orbit; pinch or scroll to zoom."></canvas><div class="loading-state" id="loading-state"><span class="loading-ring"></span><span>Loading robot</span></div><div class="viewport-footer"><span>Drag to orbit <span class="separator">/</span> Pinch to zoom</span><button class="view-reset" id="view-reset" type="button" aria-label="Reset view and zero all axes" title="Reset to isometric view and zero all axes"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5.2 5.4A6.3 6.3 0 1 1 3.7 12M3.5 3.5v4.2h4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Reset view</span></button></div></section><section class="control-panel" aria-label="Joint controls"><div class="panel-heading"><div><h2>Joint controls</h2></div></div><div class="panel-body" id="panel-body"><div class="axis-list" id="axis-list"></div></div></section></section><div class="sr-only" id="announcements" role="status" aria-live="polite"></div></main><script type="module" src="/src/main.ts"></script></body></html>
